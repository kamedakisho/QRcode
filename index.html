<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dr.パーソナル受付</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f7fb;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      text-align: center;
      color: #222;
      overflow: hidden;
    }

    .header {
      background: #0068c9;
      color: #ffffff;
      padding: 28px 20px;
      font-size: 42px;
      font-weight: bold;
    }

    h1 {
      margin: 60px 20px 20px;
      font-size: 42px;
    }

    .guide {
      margin: 20px;
      color: #555;
      font-size: 24px;
    }

    .qr-icon {
      margin: 35px auto;
      font-size: 120px;
      line-height: 1;
    }

    #message {
      width: 86%;
      max-width: 900px;
      min-height: 125px;
      margin: 35px auto;
      padding: 30px;
      border-radius: 12px;
      background: #2eae55;
      color: #ffffff;
      font-size: 34px;
      font-weight: bold;
      line-height: 1.5;
      white-space: pre-line;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    #debug {
      min-height: 28px;
      margin: 15px auto;
      font-size: 18px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="header">Dr.パーソナル</div>

  <h1>会員証のQRコードをかざしてください</h1>

  <div class="guide">
    QRコードリーダーで会員証を読み取ってください
  </div>

  <div class="qr-icon">▦</div>

  <div id="message">読み取り待機中</div>

  <div id="debug"></div>

  <script>
    /*
     * Apps ScriptのウェブアプリURL
     * 必ず現在有効な /exec のURLを指定してください。
     */
    const GAS_API_URL =
      'https://script.google.com/macros/s/AKfycbwIsPp43GFGyJ4gOshab_odDCjpPGS8yRhUsygNJZBsf_-Y4lb8GR9tLhFX2-ZAu1jr/exec';

    const messageElement =
      document.getElementById('message');

    const debugElement =
      document.getElementById('debug');

    /*
     * ZEBRAの入力をためる変数
     */
    let scanBuffer = '';
    let scanTimer = null;

    /*
     * 通信処理中かどうか
     */
    let processing = false;

    /*
     * 同じQRの連続読み取り防止
     */
    let lastCode = '';
    let lastScanTime = 0;

    /*
     * 会員IDを整える
     */
    function normalizeMemberId(value) {
      let normalized = String(value || '');

      try {
        normalized = normalized.normalize('NFKC');
      } catch (error) {
        // 何もしない
      }

      normalized = normalized
        .replace(/[\u0000-\u001F\u007F]/g, '')
        .replace(/[\u200B-\u200D\u2060\uFEFF]/g, '')
        .replace(/[\s\u3000]/g, '')
        .trim();

      /*
       * 4桁の会員番号を抽出
       */
      const matches = normalized.match(/\d{4}/g);

      if (matches && matches.length > 0) {
        return matches[matches.length - 1];
      }

      return normalized;
    }

    /*
     * 読み取り成功音
     */
    function playBeep() {
      try {
        const AudioContextClass =
          window.AudioContext ||
          window.webkitAudioContext;

        if (!AudioContextClass) {
          return;
        }

        const audioContext =
          new AudioContextClass();

        const oscillator =
          audioContext.createOscillator();

        const gainNode =
          audioContext.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);

        oscillator.type = 'sine';

        oscillator.frequency.setValueAtTime(
          1400,
          audioContext.currentTime
        );

        gainNode.gain.setValueAtTime(
          0.18,
          audioContext.currentTime
        );

        oscillator.start();

        oscillator.stop(
          audioContext.currentTime + 0.12
        );

      } catch (error) {
        console.log(error);
      }
    }

    /*
     * GASへJSONPで送信
     */
    function sendCheckIn(memberId) {
      return new Promise(function(resolve, reject) {
        const callbackName =
          'qrCallback_' +
          Date.now() +
          '_' +
          Math.floor(Math.random() * 100000);

        const script =
          document.createElement('script');

        let completed = false;

        const timeoutId = setTimeout(function() {
          if (completed) {
            return;
          }

          completed = true;

          delete window[callbackName];

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

          reject(
            new Error('GAS応答タイムアウト')
          );

        }, 15000);

        window[callbackName] = function(result) {
          if (completed) {
            return;
          }

          completed = true;

          clearTimeout(timeoutId);

          delete window[callbackName];

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

          resolve(result);
        };

        script.onerror = function() {
          if (completed) {
            return;
          }

          completed = true;

          clearTimeout(timeoutId);

          delete window[callbackName];

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

          reject(
            new Error('GASへの接続に失敗しました')
          );
        };

        script.src =
          GAS_API_URL +
          '?id=' +
          encodeURIComponent(memberId) +
          '&callback=' +
          encodeURIComponent(callbackName) +
          '&cache=' +
          Date.now();

        document.body.appendChild(script);
      });
    }

    /*
     * QR読み取り後の処理
     */
    async function processScannedCode(rawValue) {
      /*
       * 次回に持ち越さないよう、
       * 最初に必ずバッファを空にする
       */
      scanBuffer = '';
      clearTimeout(scanTimer);

      const memberId =
        normalizeMemberId(rawValue);

      if (!memberId) {
        return;
      }

      if (!/^\d{4}$/.test(memberId)) {
        messageElement.style.background =
          '#d93025';

        messageElement.textContent =
          'QRコードの内容が正しくありません';

        debugElement.textContent =
          '読み取り内容：［' +
          rawValue +
          '］';

        resetScreen(4000);
        return;
      }

      if (processing) {
        return;
      }

      const now = Date.now();

      if (
        memberId === lastCode &&
        now - lastScanTime < 5000
      ) {
        return;
      }

      processing = true;
      lastCode = memberId;
      lastScanTime = now;

      playBeep();

      messageElement.style.background =
        '#f0a000';

      messageElement.textContent =
        '確認中...';

      debugElement.textContent =
        '読み取り会員番号：' +
        memberId;

      try {
        const result =
          await sendCheckIn(memberId);

        if (result && result.ok) {
          messageElement.style.background =
            '#2eae55';
        } else {
          messageElement.style.background =
            '#d93025';
        }

        messageElement.textContent =
          result && result.message
            ? result.message
            : '処理結果を取得できませんでした';

      } catch (error) {
        console.error(error);

        messageElement.style.background =
          '#d93025';

        messageElement.textContent =
          '通信エラー：' +
          error.message;
      }

      resetScreen(4000);
    }

    /*
     * 待機画面に戻す
     */
    function resetScreen(waitTime) {
      setTimeout(function() {
        scanBuffer = '';
        processing = false;

        messageElement.style.background =
          '#2eae55';

        messageElement.textContent =
          '読み取り待機中';

        debugElement.textContent = '';

      }, waitTime);
    }

    /*
     * ZEBRAから送られたキー入力を受け取る
     */
    document.addEventListener(
      'keydown',
      function(event) {
        /*
         * Ctrl、Alt、Shiftなどは無視
         */
        if (
          event.ctrlKey ||
          event.altKey ||
          event.metaKey
        ) {
          return;
        }

        /*
         * Enterが来たら受付処理
         */
        if (event.key === 'Enter') {
          event.preventDefault();

          const completedCode =
            scanBuffer;

          scanBuffer = '';
          clearTimeout(scanTimer);

          if (completedCode) {
            processScannedCode(
              completedCode
            );
          }

          return;
        }

        /*
         * Tabも読み取り終了として扱う
         */
        if (event.key === 'Tab') {
          event.preventDefault();

          const completedCode =
            scanBuffer;

          scanBuffer = '';
          clearTimeout(scanTimer);

          if (completedCode) {
            processScannedCode(
              completedCode
            );
          }

          return;
        }

        /*
         * 1文字のキーだけバッファに追加
         */
        if (event.key.length === 1) {
          event.preventDefault();

          scanBuffer += event.key;

          /*
           * Enterを送らないリーダーでも、
           * 入力停止から250ms後に受付する
           */
          clearTimeout(scanTimer);

          scanTimer = setTimeout(
            function() {
              const completedCode =
                scanBuffer;

              scanBuffer = '';

              if (completedCode) {
                processScannedCode(
                  completedCode
                );
              }
            },
            250
          );
        }
      },
      true
    );

    /*
     * 画面を開いたときに残った値を消す
     */
    window.addEventListener(
      'load',
      function() {
        scanBuffer = '';
        processing = false;
      }
    );
  </script>

</body>
</html>
